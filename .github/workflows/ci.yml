name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install uv==0.9.15
          uv sync --frozen --extra dev --python 3.12

      - name: Ruff
        run: uv run --frozen --extra dev ruff check .

      - name: Mypy
        run: uv run --frozen --extra dev mypy src

      - name: Pytest + coverage gate
        run: |
          uv run --frozen --extra dev coverage run -m pytest
          uv run --frozen --extra dev coverage report --fail-under=71

  windows-research-boundaries:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install uv==0.9.15
          uv sync --frozen --extra dev --python 3.12

      - name: Windows research boundary tests
        run: >-
          uv run --frozen --extra dev pytest tests/test_research_capture.py tests/test_windows_job.py
          tests/test_commissioning_worker.py tests/test_commissioning_custody.py
          tests/test_commissioning_journal.py tests/test_commissioning_source.py
          tests/test_commissioning_installer.py
